[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clinnova-fl"
version = "1.0.0"
description = "Proof of Concept (PoC) for a computation of histograms in a federated environment"
license = "Apache-2.0"
authors = [
    { name = "Alberto Zancanaro", email = "alberto.zancanaro@uni.lu" },
]
dependencies = [
    "flwr[simulation]>=1.22.0",
    "flwr-datasets[vision]>=0.5.0",
    "matplotlib>=3.9.0",
    "numpy>=2.0.2",
    "pandas==2.2.3",
    "scikit-learn>=1.5.0",
    "streamlit>=1.37.0",
    "toml>=0.10.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/clinnova_fl"]

[project.scripts]
clinnova-ml = "clinnova_fl.cli:main_ml"
clinnova-hist = "clinnova_fl.cli:main_hist"
clinnova-streamlit-ml = "clinnova_fl.ui.streamlit.interface_ml:main"
clinnova-streamlit-hist = "clinnova_fl.ui.streamlit.interface_hist:main"

[tool.flwr.app]
publisher = "LCSB"

[tool.flwr.app.components]
serverapp = "clinnova_fl.apps.flower_hist.server:app"
clientapp = "clinnova_fl.apps.flower_hist.client:app"

[tool.flwr.app.config]
path_server_config = './config/server_config_hist.toml'

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 4

[tool.flwr.federations.local-deployment]
address = "127.0.0.1:9093"
insecure = true # To run with insecure connection
# root-certificates = "certificates/ca.crt" # To run with TLS (secure) connection

[tool.flwr.federations.remote-hist]
# address = "10.240.18.119:9093"
address = "127.0.0.1:9093"
insecure = true  # Disable TLS (not recommended for production)
