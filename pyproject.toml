[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - 

[project]
name = "clinnova-fl"
version = "1.0.0"
description = "Proof of Concept (PoC) for a computation of histograms in a federated environment"
license = "Apache-2.0"
authors = [
    { name = "Alberto Zancanaro", email = "alberto.zancanaro@uni.lu" },
]
dependencies = [
    "flwr[simulation]>=1.28.0",
    "flwr-datasets[vision]>=0.5.0",
    "matplotlib>=3.9.0",
    "numpy>=2.0.2",
    "pandas==2.2.3",
    "scikit-learn>=1.5.0",
    "streamlit>=1.37.0",
    "toml>=0.10.2",
]

[project.scripts]
clinnova-hist = "clinnova_fl.cli:flower_hist"

# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - 

[tool.hatch.build.targets.wheel]
packages = ["src/clinnova_fl"]

# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - 
[tool.flwr.app]
publisher = "LCSB"

[tool.flwr.app.components]
serverapp = "clinnova_fl.apps.server:app"
clientapp = "clinnova_fl.apps.client:app"

# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - 
# Config for all flower apps

[tool.flwr.app.config]
app = "X"
path_app_config = "X"
dataset_id = "X"
simulation = false
run_with_nvflare = false

